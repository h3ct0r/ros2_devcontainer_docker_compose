# DEV_USER / DEV_HOME are exported by /entrypoint.sh (root under rootless Docker).
# USER / LOGNAME are set too: supervisord runs under sudo, and gosu only resets HOME.

[group:vnc-workers]
programs=vnc,novnc

[program:vnc]
command=gosu %(ENV_DEV_USER)s /usr/local/bin/vnc_run.sh
environment=HOME="%(ENV_DEV_HOME)s",USER="%(ENV_DEV_USER)s",LOGNAME="%(ENV_DEV_USER)s"
priority=100
autorestart=true

[program:novnc]
command=websockify --web=/usr/lib/novnc 3080 localhost:5902
priority=200
autorestart=true

[program:code-server]
command=gosu %(ENV_DEV_USER)s /usr/local/bin/code_server_run.sh
directory=/home/ubuntu
environment=HOME="%(ENV_DEV_HOME)s",USER="%(ENV_DEV_USER)s",LOGNAME="%(ENV_DEV_USER)s",DONT_PROMPT_WSL_INSTALL="1"
autorestart=true
