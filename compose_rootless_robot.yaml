# Rootless Docker on the robot: host network and device access.
#   docker compose -f compose_rootless_robot.yaml up -d
# Host networking reaches the real host network only on rootless Docker Engine 29.5
# or newer; with older engines use compose_rootless.yaml plus ROS_TRANSPORT=zenoh
# (or bridge) so other machines connect over TCP 7447.
# Devices need configs/udev/99-ros-dev.rules installed on the host.
services:
  ros2:
    extends:
      file: compose.common.yaml
      service: ros2
    image: ${IMAGE_NAME:-h3ct0rdcc/ros2_humble_development}:${TARGET:-robot}
    build:
      target: ${TARGET:-robot}
    user: root
    ipc: host
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
