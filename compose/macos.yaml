# Docker Desktop on macOS. GUI apps from code-server, ssh and docker exec open on the
# VNC desktop: the Mac's own DISPLAY (an XQuartz socket path) isn't reachable.
services:
  ros2:
    environment:
      - DISPLAY=:2
    volumes:
      - /var/log/val_logger:/var/log/val_logger
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=1"
      - "net.ipv6.conf.default.disable_ipv6=1"
      - "net.ipv6.conf.lo.disable_ipv6=1"
