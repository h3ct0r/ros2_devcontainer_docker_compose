# Rootful Docker on Linux (workstation or robot): host network, full device access.
#   docker compose -f compose_linux.yaml up -d
#   TARGET=robot docker compose -f compose_linux.yaml up -d    # on the robot
services:
  ros2:
    extends:
      file: compose.common.yaml
      service: ros2
    ipc: host
    pid: host
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'
      - 'c 189:* rmw'
