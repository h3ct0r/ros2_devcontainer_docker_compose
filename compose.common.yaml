# Shared service definition. Not meant to be run directly: use one of
# compose_linux.yaml, compose_linux_nvidia.yaml, compose_macos.yaml,
# compose_rootless.yaml or compose_rootless_robot.yaml, which extend it.
# Settings come from the environment or a .env file (see .env.example).
services:
  ros2:
    container_name: ros2_humble_development
    image: ${IMAGE_NAME:-h3ct0rdcc/ros2_humble_development}:${TARGET:-full}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ${TARGET:-full}
    hostname: ros2_docker
    extra_hosts:
      - "ros2_docker:127.0.0.1"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - TZ=${TZ:-UTC}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - ROS_TRANSPORT=${ROS_TRANSPORT:-dds}
      - ZENOH_CONNECT=${ZENOH_CONNECT:-}
      - ZENOH_NAMESPACE=${ZENOH_NAMESPACE:-}
      - DEV_PASSWORD=${DEV_PASSWORD:-ubuntu}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD:-}
    volumes:
      - ./local_mount/:/home/ubuntu/ros2_ws
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
