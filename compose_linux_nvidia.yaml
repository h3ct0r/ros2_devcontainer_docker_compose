# Rootful Docker on Linux with an NVIDIA GPU (needs nvidia-container-toolkit).
services:
  ros2:
    extends:
      file: compose_linux.yaml
      service: ros2
    runtime: nvidia
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
