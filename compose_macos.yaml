# Docker Desktop on macOS. Runs natively: arm64 on Apple Silicon, amd64 on Intel.
services:
  ros2:
    extends:
      file: compose.common.yaml
      service: ros2
    ipc: host
    pid: host
    privileged: true
    network_mode: bridge
    ports:
      - "3080:3080"   # noVNC
      - "3081:3081"   # code-server
      - "3022:3022"   # ssh
      - "5902:5902"   # VNC
      - "7447:7447"   # Zenoh (ROS_TRANSPORT=zenoh or bridge)
    environment:
      # GUI apps from code-server, ssh and docker exec open on the VNC desktop. The Mac's
      # own DISPLAY (an XQuartz socket path) doesn't exist inside the container.
      - DISPLAY=:2
    volumes:
      - /var/log/val_logger:/var/log/val_logger
    sysctls:
      - "net.ipv6.conf.all.disable_ipv6=1"
      - "net.ipv6.conf.default.disable_ipv6=1"
      - "net.ipv6.conf.lo.disable_ipv6=1"
